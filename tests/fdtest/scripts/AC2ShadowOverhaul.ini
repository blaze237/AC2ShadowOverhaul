; AC2ShadowOverhaul settings. Lives next to AC2ShadowOverhaul.asi in the scripts folder.

[Shadows]
; Pushes shadows further away from the camera. The vanilla game cuts shadows off close to
; the camera in two ways, and both are scaled by this multiplier:
;  - smaller objects and building pieces stop casting shadows after ~15-30 m, which shows up
;    as a line sweeping across buildings as shadows pop in while you move
;  - the sun shadow cascades (and their fade-out) end a short distance from the camera
; Higher values cover more distance but stretch the same shadow map over a larger area, so
; shadows get softer. Pair with EaglePatch+'s ImproveShadowMapResolution=1 to keep them sharp.
; Supported values: 1.0 (vanilla) to 20.0
; Default - 3.0
ShadowDistanceScale=3.0

; Advanced: override the multiplier for individual parts (0 = use ShadowDistanceScale)
; ShadowCascadeSplitScale   - the three inner cascade boundaries. Lower values keep shadows
;                             close to the camera sharper, while the far cascade still
;                             reaches ShadowDistanceScale. 1.0 = vanilla near cascades.
; ShadowCasterDistanceScale - distance at which smaller objects stop casting shadows
; Default - 0
ShadowCascadeSplitScale=0
ShadowCasterDistanceScale=0

; Draw distance multiplier for smaller objects / building details (vanilla 50 m / 70 m at max
; EnvironmentQuality). Beyond this they are not drawn at all, so their shadows end here too:
; raising ShadowCasterDistanceScale past ~3 does nothing unless this is raised as well.
; Costs some performance. Supported values: 1.0 (vanilla) to 20.0
; Default - 2.0
DetailDrawDistanceScale=2.0

[SoftShadows]
; Softer sun shadow edges. The game blends its shadow map over a single texel, so shadows look
; blocky once the cascades are stretched with ShadowDistanceScale. This widens that blend.
; Enabled      - 0 - off, 1 - on (needs a game restart)
; FilterWidth  - edge softness in shadow map texels (needs a game restart)
;                1 = same as the game, 2 = soft (9 taps), 3 = softer (16 taps), 4 = softest (25 taps)
; StartEnabled - 1 = start with soft shadows on, 0 = start with the game's filter
Enabled=1
FilterWidth=3

[AmbientOcclusion]
StartEnabled=1
DebugView=0
ShadingNormals=1

[ContactShadows]
StartEnabled=1

[Menu]
; In-game menu, top right. MenuKey shows/hides it; Up/Down or 1-0 select, Left/Right change.
MenuKey=0x78
StartVisible=1

[Debug]
; Write AC2ShadowOverhaul.log next to this file. 0 - off, 1 - on
EnableLogging=1

; Frame dump: the menu's "Frame dump" item writes AC2ShadowOverhaul_FrameDump_<time>.txt next to this
; file, describing how the frame is rendered (render targets, depth buffers, draw batches).
; Also exports every pixel shader that reads the sun shadow map: disassembly in
; AC2ShadowOverhaul_FrameDump_<time>_shaders.txt and bytecode in the matching _shaders folder.
; Diagnostic only; a short beep confirms the file was written.
; FrameDump       - 0 - off, 1 - on
; FrameDumpFrames - consecutive frames per dump (1 to 4)
FrameDump=1
FrameDumpKey=0x77
FrameDumpFrames=1

[SSGI]
Enabled=0

[VolumetricFog]
Enabled=0

[SunShafts]
Enabled=0

[TAA]
Enabled=0
