; AC2ShadowOverhaul settings. Lives next to AC2ShadowOverhaul.asi in the scripts folder.
;
; Longer and softer shadows, ambient occlusion and contact shadows, bounce light (SSGI), volumetric
; fog and sun shafts, and temporal anti-aliasing (TAA). The screen-space effects need the game's own
; anti-aliasing (MSAA) switched off; a red warning appears on screen if it is on.
;
; PRESETS - copy one row into the settings below (the shipped values are "High").
;   Distance = ShadowDistanceScale, Splits = ShadowCascadeSplitScale,
;   Casters = ShadowCasterDistanceScale, Detail = DetailDrawDistanceScale, Width = FilterWidth
;
;   Preset        Distance  Splits  Casters  Detail  Width   
;   Light            2.0     1.0     10.0     10.0      2     
;   Balanced         3.0     2       10.0     10.0      4     
;   High             6.0     6.0     10.0     10.0      4     
; In game: F9 = shadows & AO menu, F3 = SSGI, F11 = volumetrics, F1 = TAA. Try values live; they are
; saved back into this file.

[Shadows]
; Pushes shadows further away from the camera. The vanilla game cuts shadows off close to
; the camera in two ways, and both are scaled by this multiplier:
;  - smaller objects and building pieces stop casting shadows after ~15-30 m, which shows up
;    as a line sweeping across buildings as shadows pop in while you move
;  - the sun shadow cascades (and their fade-out) end a short distance from the camera
; Higher values cover more distance but stretch the same shadow map over a larger area, so
; shadows get softer. Pair with EaglePatch+'s ImproveShadowMapResolution=1 to keep them sharp.
; Supported values: 1.0 (vanilla) to 20.0
; Default - 3.0
ShadowDistanceScale=6.0

; Multipliers for individual parts (0 = same as ShadowDistanceScale)
; ShadowCascadeSplitScale   - the three inner cascade boundaries. Lower values keep shadows
;                             close to the camera sharper, while the far cascade still
;                             reaches ShadowDistanceScale. 1.0 = vanilla near cascades.
; ShadowCasterDistanceScale - distance at which smaller objects stop casting shadows
; Default - ShadowCascadeSplitScale 1.5, ShadowCasterDistanceScale 4.0
ShadowCascadeSplitScale=6.0
ShadowCasterDistanceScale=10.0

; Draw distance multiplier for smaller objects / building details (vanilla 50 m / 70 m at max
; EnvironmentQuality). Beyond this they are not drawn at all, so their shadows end here too:
; keep ShadowCasterDistanceScale at no more than about twice this value, or the extra is wasted.
; Costs some performance. Supported values: 1.0 (vanilla) to 20.0
; Default - 2.0
DetailDrawDistanceScale=10.0

[SoftShadows]
; Softer sun shadow edges. The game blends its shadow map over a single texel, so shadows look
; blocky once the cascades are stretched with ShadowDistanceScale. This widens that blend.
; FilterWidth  - edge softness in shadow map texels (live in the menu, else needs a restart)
;                0 = off (the game's own filter), 1 = same footprint as the game, 2 = soft (9 taps),
;                3 = softer (16 taps), 4 = softest (25 taps)
FilterWidth=4
; Contact hardening: the edge softness follows the distance from the shadow's caster, so shadows are
; sharp where an object meets the ground (feet, walls, posts) and soften further from it, as real
; sun shadows do. FilterWidth's width is then not used (FilterWidth=0 still switches soft shadows
; off). Experimental: on low-resolution or very stretched cascades it may look noisier than the
; plain filter, so it starts off. All of these are live in the menu, else need a restart.
; ContactHardening - 1 = on, 0 = off (the plain FilterWidth filter)
; PenumbraScale    - how fast shadows soften: edge width in metres per metre between caster and
;                    receiver (0.005 to 0.5; 0.04 = a 4 cm wide edge 1 m below the caster)
; MinWidth         - sharpest edge, in shadow map texels (1 = the game's own, up to 4)
; MaxWidth         - softest edge, in shadow map texels (up to 4, the widest FilterWidth); a
;                    MinWidth above it acts as MaxWidth
ContactHardening=0
PenumbraScale=0.04
MinWidth=1.0
MaxWidth=4.0

[AmbientOcclusion]
; Ambient occlusion: darkens the game's ambient and bounce light in creases, corners, under ledges
; and around characters, worked out from the scene depth every frame (GTAO). Only the indirect
; light is darkened: sunlight, fog, sky and transparent effects are left as they are.
; Enabled      - 1 = on, 0 = completely off (the game's shaders are left alone); needs a restart
; Radius       - how far around each point occluders count, in metres (0.25 to 8)
; Strength     - 1 = as computed, higher = darker (0 to 4)
; StartEnabled - 1 = AO on, 0 = off (switch it in the menu without a restart)
; DebugView    - 0 = normal, 1 = show the AO term only, 2 = show the indirect light it is applied to,
;                3 = show the contact shadows only, 4 = show the sun light they are applied to
; ShadingNormals - 1 = AO, contact shadows and SSGI use each surface's own normal as the game lights
;                it (with its normal map detail), where the game's shader gives it; 0 = only the
;                normals worked out from the scene depth (flat facets, no normal map detail).
;                Switch it in the menu without a restart. Applies to SSGI and contact shadows
;                with Enabled=0 here too.
Enabled=1
Radius=1.5
Strength=0.5
StartEnabled=1
DebugView=0
ShadingNormals=1

[ContactShadows]
; Contact shadows: short shadows traced through the scene depth towards the sun, for the small
; detail the shadow map is too coarse to show (where feet, crates or ledges meet the ground, folds
; in clothing, window frames). Only the sunlight is darkened. Uses the same depth and setup as the
; ambient occlusion (works with [AmbientOcclusion] Enabled=0 too).
; Enabled      - 1 = on, 0 = off; needs a restart
; Length       - how far each shadow reaches from its caster, in metres (0.05 to 4)
; StartEnabled - 1 = contact shadows on, 0 = off (switch them in the menu without a restart)
Enabled=1
Length=0.5
StartEnabled=1

[SSGI]
; Screen-space global illumination (bounce light): light bounces off lit surfaces onto nearby ones -
; a sunlit wall brightens the street in front of it, red cloth tints the floor next to it, and
; courtyards fill with reflected sunlight. The bounce is added to the game's own ambient light, so
; fog applies to it as well. Needs the in-game anti-aliasing (MSAA) off. Menu: F3.
; Enabled      - 1 = on, 0 = completely off (the game's shaders are left alone); needs a restart
; StartEnabled - 1 = on, 0 = off (switch it in the menu without a restart)
Enabled=1
StartEnabled=1
; Strength of the bounce light (0-2). 1 = physically based for one bounce.
; The game's baked ambient light already holds some bounce, so 0.75-1.5 is the useful range.
; The bounce lights the next frame's bounce, so light keeps bouncing over the frames; above 1 that
; is held back to what it is at 1 (so it can't build up without end), and only the first bounce
; gets brighter.
Intensity=1.0
; How far light is gathered from, in metres. Larger reaches further but is noisier.
Radius=10.0
; Longest distance on screen light is gathered from, as a share of the screen height. Lower is
; cheaper but confines the light to near corners and edges for distant surfaces.
MaxScreenRadius=1.0
; How thick objects are assumed to be behind their visible surface, in metres. Light from behind
; thin objects (poles, legs) gets through beyond this.
Thickness=0.5
; Quality: directions per pixel and samples per direction (each way). Cost grows with both.
; Low: 2 / 6    Default: 3 / 8    High: 4 / 12
Slices=3
Steps=8
; Weight of the newest frame when averaging over frames (0.02-1). Lower is smoother but
; slower to react to moving light. Doubled while TAA averages the frames ([TAA] AssistEffects).
TemporalBlend=0.1
; Brightest scene colour that bounces (HDR highlights above this are clamped; avoids flicker).
RadianceClamp=4.0
; How far the light averaged over frames may be from this frame's light around each pixel, in
; standard deviations of this frame's (noisy) light (0-4, 0 = off). Where the light changed, e.g. a
; sunlit wall's bounce on the floor as someone walks past, the old light goes at once instead of
; trailing behind for a dozen frames. Lower reacts faster but lets more noise through.
HistoryClamp=1.5
; 0 = normal, 1 = show the GI light, 2 = show the raw trace, 3 = show normals.
DebugView=0

[VolumetricFog]
; Fog that is lit by the sun through the game's own shadow map: where sunlight gets between
; buildings, through arches or past towers you see shafts of light in the air ("god rays").
; Needs the in-game anti-aliasing (MSAA) off. Menu: F11.
; Enabled      - 1 = on, 0 = completely off; needs a restart
; StartEnabled - 1 = on, 0 = off (switch it in the menu without a restart)
Enabled=1
StartEnabled=1
; How thick the fog is at and below BaseHeight (share of light lost per metre). 0.001 is a light
; haze; 0.003 is noticeably foggy.
Density=0.0012
; How quickly the fog thins out with height (per metre): 0.02 halves it every 35 m above BaseHeight.
; 0 = the same everywhere.
HeightFalloff=0.02
; World height (metres) at and below which the fog is at full density.
BaseHeight=0
; Sunlight scattered by the fog - the strength of the god rays.
SunIntensity=0.35
; How much the fog scatters light forwards (0 = evenly in all directions; up to 0.9 = mostly when
; you look towards the sun).
Anisotropy=0.45
; Sky light scattered by the fog, tinted by the game's own fog colour.
AmbientIntensity=0.25
; How much cover overhead takes that sky light away (0-1; 0 = off): under roofs, vaults and arcades,
; in tombs and narrow alleys the air doesn't glow with sky haze like in an open square. Read from the
; sun's shadow map (how high the cover over each bit of air is), so it fades out as the sun gets low
; (from about 20 degrees above the horizon down to 6) and does nothing where the game has no sun shadows.
SkyOcclusion=0.8
; Drifting 3D noise in the fog's thickness, for wisps instead of an even haze (0-1; 0 = smooth fog).
; The fog stays as thick on average.
NoiseAmount=0.5
; Size of the largest wisps in metres (2-200).
NoiseSize=15
; How fast the wisps drift (metres per second, 0-20) and where to: WindDirection in degrees (0-360)
; turns the drift around. They also rise slowly, so they change shape as they go.
WindSpeed=1.5
WindDirection=30
; Metres of fog the effect covers (the game's own distance fog still covers everything further away).
MaxDistance=300
; Quality: samples per pixel along each ray (8-128) and the resolution divisor (1 = full
; resolution, 2 = half, 4 = quarter). Lower is faster.
Steps=40
Resolution=2
; Where in the frame the fog is added: 0 = after the sky, before smoke, glass and other transparent
; effects (they then stay sharp in front of the fog); 1 = after them (they get fogged by the
; distance of whatever is behind them).
Placement=0
; 0 normal, 1 fog light only, 2 fog transmittance (how much of the scene shows through), 3 shafts only.
DebugView=0

[SunShafts]
; Screen-space light streaks from the bright sky around the sun when it is on screen and partly
; hidden behind buildings, trees or clouds. Needs the in-game anti-aliasing (MSAA) off. Menu: F11.
; Enabled      - 1 = on, 0 = completely off; needs a restart
; StartEnabled - 1 = on, 0 = off (switch them in the menu without a restart)
Enabled=1
StartEnabled=1
Intensity=0.35
; How far the streaks reach back from the sun (share of the way across to it, 0.05-1).
Length=0.75
; Only sky brighter than this (0-0.95) sends out streaks.
Threshold=0.5
; How tightly the source is gathered around the sun (higher = only close to the sun).
SunFalloff=12
; How quickly the streaks fade along their length (0.5-1; 1 = no fade).
Decay=0.93

[TAA]
; Temporal anti-aliasing: smooths jagged edges and shimmer by blending each frame with the previous
; ones. Switch the in-game anti-aliasing (MSAA) OFF: TAA replaces it and does not run on a
; multisampled scene. Menu: F1.
; Enabled      - 1 = on; changing it needs a restart (the game's vertex shaders are patched when loaded)
; StartEnabled - 1 = on, 0 = off (switch it in the menu without a restart)
Enabled=1
StartEnabled=1
; How much of the accumulated image is kept each frame, 0..0.98. Higher = smoother edges and less
; shimmer when still, but more blur in motion.
Feedback=0.95
; The same while the image is moving fast (lower = sharper in motion, a little more shimmer).
MotionFeedback=0.8
; Sharpening of the result, 0 = none, 1 = strong (it can't create halos: it stays within the
; neighbouring pixels' range). TAA softens the image slightly; 0.2-0.4 restores the crispness.
Sharpness=0.25
; Texture mip bias while the scene is drawn, -2..1. Negative = sharper textures (TAA removes the
; shimmer that would normally cause). 0 = the game's own.
MipBias=-0.5
; 1 = the other effects lean on TAA while it runs: ambient occlusion, contact shadows and the
; volumetric fog change their sampling pattern every frame for TAA to average (AO and contact
; shadows then also use a narrower blur, so they keep more detail), and SSGI keeps a shorter history
; of its own (its TemporalBlend doubled), so moving light isn't held back by both histories. Same
; cost. 0 = they run exactly as with TAA off (to compare). They always line up with TAA's jitter.
AssistEffects=1
; Advanced ---
; Sub-pixel jitter size, 0..2 (1 = one pixel). 0 turns the jitter off (then TAA only smooths
; shimmer in motion and doesn't anti-alias still edges).
JitterScale=1
; Size of the colour range the history is clipped to, in standard deviations (0.5..4). Lower =
; less ghosting behind moving things, higher = less flicker.
ClipBox=1.25
; How much a surface's depth may differ from the previous frame before its history is thrown away
; (0.05 = 5 %).
DepthTolerance=0.05
; 0 = normal. 1 = tint by how the history was found: green = camera motion, blue = moved with the
; camera (the player), red = nothing usable (current frame only). 2 = show the motion.
DebugView=0

[Menu]
; Each group of effects has its own in-game settings menu, drawn in the top-right corner; only one
; is open at a time (opening one closes the other). Its key shows / hides it; while it is shown,
; Up/Down or the number keys 1-9, 0 select a setting (shown in red) and Left/Right change it (holding
; a key repeats). Changes apply at once and are saved back into this file (a second after the last
; key press, and when the game exits), so the next launch starts with them. Comments are kept.
; The shadow menu's "All shadow effects" switches the shadow tweaks, soft shadows, ambient occlusion
; and contact shadows off and back on for a quick comparison with vanilla; the volumetrics menu has
; its own "All volumetric effects". Neither is saved.
; Note the number and arrow keys still reach the game too while a menu is shown.
; Virtual key codes: F1 = 0x70 ... F12 = 0x7B; 0 = no menu.
; MenuKey            - shadows, soft shadows, ambient occlusion, contact shadows (F9)
; SSGIMenuKey        - SSGI (F3)
; TAAMenuKey         - TAA (F1)
; VolumetricsMenuKey - volumetric fog and sun shafts (F11)
; AllEffectsKey      - switches every effect off and back on, for comparisons with vanilla (F12; not saved, 0 = none)
; StartVisible       - 1 = the shadow menu is shown at start, 0 = hidden until MenuKey
MenuKey=0x78
SSGIMenuKey=0x72
TAAMenuKey=0x70
VolumetricsMenuKey=0x7A
AllEffectsKey=0x7B
StartVisible=0

[Debug]
; Write AC2ShadowOverhaul.log next to this file. 0 - off, 1 - on
EnableLogging=0

; Frame dump: choose "Frame dump" (last in the menu) and press Right, or press FrameDumpKey, to write
; AC2ShadowOverhaul_FrameDump_<time>.txt next to this file, describing how the frame is rendered
; (render targets, depth buffers, draw batches).
; Also exports every pixel shader that reads the sun shadow map: disassembly in
; AC2ShadowOverhaul_FrameDump_<time>_shaders.txt and bytecode in the matching _shaders folder.
; Diagnostic only; a short beep confirms the file was written.
; FrameDump       - 0 - off, 1 - on (adds "Frame dump" to the menu)
; FrameDumpKey    - optional hotkey for debugging (virtual key code, e.g. 0x77 = F8); 0 = none
; FrameDumpFrames - consecutive frames per dump (1 to 4)
; FrameDumpDepth  - 1 = also read back the game's depth buffers (pictures + a comparison with the
;                   game's own depth target) and export every shader with its constant values.
;                   The depth buffers are created in a readable format from game start, so this
;                   only takes effect if FrameDump=1 when the game is launched. 0 = off.
FrameDump=0
FrameDumpKey=0
FrameDumpFrames=1
FrameDumpDepth=1
