; AC2ShadowOverhaul settings. Lives next to AC2ShadowOverhaul.asi in the scripts folder.
;
; PRESETS - copy one row into the settings below (the shipped values are "High").
;   Distance = ShadowDistanceScale, Splits = ShadowCascadeSplitScale,
;   Casters = ShadowCasterDistanceScale, Detail = DetailDrawDistanceScale, Width = FilterWidth
;
;   Preset        Distance  Splits  Casters  Detail  Width   
;   Light            2.0     1.0     10.0     10.0      2     
;   Balanced         3.0     2       10.0     10.0      4     
;   High             6.0     6.0     10.0     10.0      4     
; Use [DebugMenu] Enabled=1 to try values live in game.

[Shadows]
; Pushes shadows further away from the camera. The vanilla game cuts shadows off close to
; the camera in two ways, and both are scaled by this multiplier:
;  - smaller objects and building pieces stop casting shadows after ~15-30 m, which shows up
;    as a line sweeping across buildings as shadows pop in while you move
;  - the sun shadow cascades (and their fade-out) end a short distance from the camera
; Higher values cover more distance but stretch the same shadow map over a larger area, so
; shadows get softer. Pair with EaglePatch+'s ImproveShadowMapResolution=1 to keep them sharp.
; Supported values: 1.0 (vanilla) to 20.0
; Default - 3.0
ShadowDistanceScale=6.0

; Multipliers for individual parts (0 = same as ShadowDistanceScale)
; ShadowCascadeSplitScale   - the three inner cascade boundaries. Lower values keep shadows
;                             close to the camera sharper, while the far cascade still
;                             reaches ShadowDistanceScale. 1.0 = vanilla near cascades.
; ShadowCasterDistanceScale - distance at which smaller objects stop casting shadows
; Default - ShadowCascadeSplitScale 1.5, ShadowCasterDistanceScale 4.0
ShadowCascadeSplitScale=6.0
ShadowCasterDistanceScale=10.0

; Draw distance multiplier for smaller objects / building details (vanilla 50 m / 70 m at max
; EnvironmentQuality). Beyond this they are not drawn at all, so their shadows end here too:
; keep ShadowCasterDistanceScale at no more than about twice this value, or the extra is wasted.
; Costs some performance. Supported values: 1.0 (vanilla) to 20.0
; Default - 2.0
DetailDrawDistanceScale=10.0

; Hotkey that switches all of the above between your settings and vanilla on the fly, for
; before/after comparisons. A high beep means your settings are on, a low beep means vanilla.
; (EaglePatch+'s ImproveShadowMapResolution is not affected; it can't change while running.)
; ToggleKey    - virtual key code, e.g. 0x76 = F7, 0x75 = F6; 0 = no hotkey
; StartEnabled - 1 = start with your settings on, 0 = start vanilla
ToggleKey=0x76
StartEnabled=1

[SoftShadows]
; Softer sun shadow edges. The game blends its shadow map over a single texel, so shadows look
; blocky once the cascades are stretched with ShadowDistanceScale. This widens that blend.
; FilterWidth  - edge softness in shadow map texels (live in the debug menu, else needs a restart)
;                1 = same as the game, 2 = soft (9 taps), 3 = softer (16 taps), 4 = softest (25 taps)
; ToggleKey    - switches between soft shadows and the game's filter while playing, for comparisons
;                (virtual key code, e.g. 0x75 = F6; 0 = no hotkey). High beep = soft, low beep = game.
FilterWidth=4
ToggleKey=0x75

[AmbientOcclusion]
; Ambient occlusion: darkens the game's ambient and bounce light in creases, corners, under ledges
; and around characters, worked out from the scene depth every frame (GTAO). Only the indirect
; light is darkened: sunlight, fog, sky and transparent effects are left as they are.
; Enabled      - 1 = on, 0 = completely off (the game's shaders are left alone); needs a restart
; Radius       - how far around each point occluders count, in metres (0.25 to 8)
; Strength     - 1 = as computed, higher = darker (0 to 4)
; ToggleKey    - switches AO on/off while playing, for comparisons (e.g. 0x74 = F5; 0 = no hotkey)
;                High beep = on, low beep = off.
; StartEnabled - 1 = start with AO on, 0 = start with it off (the toggle key turns it on)
; DebugView    - 0 = normal, 1 = show the AO term only, 2 = show the indirect light it is applied to
Enabled=1
Radius=1.5
Strength=0.5
ToggleKey=0x74
StartEnabled=1
DebugView=0

[DebugMenu]
; In-game tuning menu, drawn in the top-right corner. Number keys 1-9 select a setting (shown in
; red), + and - change it (scales by 0.5, filter width by 1, on/off settings switch).
; Changes apply immediately and are saved back into this file (a second after the last key
; press, and when the game exits), so the next launch starts with them. Comments are kept.
; The on/off setting is saved too: switching "Shadow tweaks" off in the menu saves
; [Shadows] StartEnabled=0. Note the number and +/- keys still reach the game too.
; Enabled      - 0 - off, 1 - on
; ToggleKey    - shows/hides the menu (keys are ignored while hidden); e.g. 0x78 = F9
; StartVisible - 1 = menu shown at start, 0 = hidden until ToggleKey
; SaveChanges  - 1 = write menu changes to this file, 0 = only log them to AC2ShadowOverhaul.log
Enabled=1
ToggleKey=0x78
StartVisible=0
SaveChanges=1

[Debug]
; Write AC2ShadowOverhaul.log next to this file. 0 - off, 1 - on
EnableLogging=0

; Frame dump: press FrameDumpKey in game to write AC2ShadowOverhaul_FrameDump_<time>.txt next to this
; file, describing how the frame is rendered (render targets, depth buffers, draw batches).
; Also exports every pixel shader that reads the sun shadow map: disassembly in
; AC2ShadowOverhaul_FrameDump_<time>_shaders.txt and bytecode in the matching _shaders folder.
; Diagnostic only; a short beep confirms the file was written.
; FrameDump       - 0 - off, 1 - on
; FrameDumpKey    - virtual key code, e.g. 0x77 = F8, 0x76 = F7, 0x78 = F9
; FrameDumpFrames - consecutive frames per dump (1 to 4)
; FrameDumpDepth  - 1 = also read back the game's depth buffers (pictures + a comparison with the
;                   game's own depth target) and export every shader with its constant values.
;                   The depth buffers are created in a readable format from game start, so this
;                   only takes effect if FrameDump=1 when the game is launched. 0 = off.
FrameDump=0
FrameDumpKey=0x77
FrameDumpFrames=1
FrameDumpDepth=1
